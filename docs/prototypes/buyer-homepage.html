<!--
  THROWAWAY PROTOTYPE — Wayfinder #9 "Buyer funnel search UX" — homepage takes
  Three structurally different homepages for the IVO buyer, switchable via ?variant=A|B|C
  (floating bar / arrow keys). Brand direction — IVO, purple + gold, the headline
  "Find the part you need, without the wait", the horizontal 4-slot funnel, the
  "Most Viewed" strip — comes from the founder's own mock in UI/Homepage/1-3.png.
  Not production: no framework, inline seed data, read-only.

  What each take is probing:
    - how the make -> model -> engine variant -> part funnel sits on the homepage
    - the engine-variant step rendered as spec cards (fuel / hp / year-range / engine code)
      + an explicit "I'm not sure" path  (locked in this session: spec cards)
    - partial funnel: Search works at make + model; engine variant is optional
    - what else earns homepage space  (Most Viewed = v2, per founder; shown greyed + tagged)
  Fit badge vocabulary + the Fitment-union-Provenance rule are locked by #7 /
  docs/fitment-and-compatibility-search.html — rendered here, not decided here.
-->
<title>IVO Parts Finder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
  :root {
    --brand: #8a1a86;
    --brand-deep: #6d1569;
    --brand-ink: #ffffff;
    --gold: #f5c33b;
    --gold-deep: #d99e14;
    --gold-ink: #2c2005;
    --ground: #f8f4f9;
    --hero: #f0e3f1;
    --panel: #ffffff;
    --panel-2: #f6f0f7;
    --ink: #221a25;
    --ink-soft: #5f5763;
    --muted: #8b8290;
    --hair: #e7dcea;
    --hair-strong: #d3c5d8;
    --confirmed: #2b6a49;
    --confirmed-soft: #dcebe3;
    --unverified: #8a6412;
    --unverified-soft: #f1e7d1;
    --focus: #1f5fb8;
    --shadow-sm: 0 1px 2px rgba(34,20,37,.06);
    --shadow-md: 0 2px 6px rgba(34,20,37,.06), 0 16px 38px rgba(34,20,37,.10);
    color-scheme: light;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --brand: #9a2296;
      --brand-deep: #7a1a76;
      --ground: #161219;
      --hero: #211a24;
      --panel: #211b25;
      --panel-2: #1b1620;
      --ink: #efe7f0;
      --ink-soft: #b7adba;
      --muted: #8b8290;
      --hair: #332b38;
      --hair-strong: #453a4b;
      --confirmed: #6cbf92;
      --confirmed-soft: #1f3a2c;
      --unverified: #d4a03f;
      --unverified-soft: #382d15;
      --focus: #6da8ff;
      --shadow-md: 0 2px 6px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.42);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --brand: #9a2296;
    --brand-deep: #7a1a76;
    --ground: #161219;
    --hero: #211a24;
    --panel: #211b25;
    --panel-2: #1b1620;
    --ink: #efe7f0;
    --ink-soft: #b7adba;
    --muted: #8b8290;
    --hair: #332b38;
    --hair-strong: #453a4b;
    --confirmed: #6cbf92;
    --confirmed-soft: #1f3a2c;
    --unverified: #d4a03f;
    --unverified-soft: #382d15;
    --focus: #6da8ff;
    --shadow-md: 0 2px 6px rgba(0,0,0,.3), 0 16px 40px rgba(0,0,0,.42);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Instrument Sans", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  h1, h2, h3, h4, h5 {
    font-family: "Archivo", "Instrument Sans", sans-serif;
    font-weight: 700;
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  a { color: var(--brand); }
  .mono { font-family: "Spline Sans Mono", ui-monospace, monospace; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

  /* ---------------------------------------------------------------- proto banner */
  .proto-note {
    background: repeating-linear-gradient(-45deg, rgba(138,26,134,.10), rgba(138,26,134,.10) 12px, transparent 12px, transparent 24px);
    border-bottom: 1px solid var(--hair-strong);
    color: var(--ink-soft);
    font: 500 12px/1.4 "Spline Sans Mono", monospace;
    letter-spacing: .02em;
    padding: 6px 20px;
    text-align: center;
  }
  .proto-note b { color: var(--brand); }

  /* ---------------------------------------------------------------- shared chrome */
  .shell { width: min(1320px, 100%); margin: 0 auto; padding: 0 clamp(16px, 3vw, 44px); }

  .topbar { background: var(--brand); color: var(--brand-ink); }
  .topbar a { color: var(--brand-ink); }
  .tb-util {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; font-size: 12.5px; padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,.16);
  }
  .tb-util nav { display: flex; gap: 18px; flex-wrap: wrap; }
  .tb-util nav a { text-decoration: none; opacity: .92; }
  .tb-util nav a:hover { opacity: 1; text-decoration: underline; }
  .tb-util nav a.sell { color: var(--gold); font-weight: 600; }
  .tb-right { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .loc { display: inline-flex; align-items: center; gap: 5px; opacity: .92; }
  .loc b { font-weight: 600; }
  .lang { display: inline-flex; border: 1px solid rgba(255,255,255,.4); border-radius: 999px; overflow: hidden; }
  .lang span { padding: 2px 9px; font-size: 11.5px; letter-spacing: .04em; }
  .lang .on { background: var(--brand-ink); color: var(--brand); font-weight: 600; }

  .tb-main { display: flex; align-items: center; gap: 22px; padding: 13px 0; }
  .burger { background: none; border: none; display: inline-grid; gap: 4px; padding: 4px; }
  .burger i { width: 22px; height: 2px; background: currentColor; display: block; }
  .brand { display: inline-flex; align-items: center; gap: 9px; font-family: "Archivo", sans-serif; font-weight: 800; font-size: 26px; letter-spacing: .04em; }
  .brand svg { width: 26px; height: 26px; display: block; }
  .tb-icons { margin-left: auto; display: flex; align-items: center; gap: 20px; }
  .tb-icons button { background: none; border: none; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; opacity: .95; }
  .tb-icons button:hover { opacity: 1; }
  .tb-icons svg { width: 21px; height: 21px; }
  .ic-badge { position: relative; }
  .ic-badge b { position: absolute; top: -6px; right: -8px; background: var(--gold); color: var(--gold-ink); font: 700 10px/1 "Spline Sans Mono", monospace; padding: 2px 4px; border-radius: 999px; }

  /* ---------------------------------------------------------------- variant caption */
  .vcap { padding: 20px 0 2px; }
  .vcap .row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .vcap h2 { font-size: 21px; }
  .vcap .k { font: 500 12px/1 "Spline Sans Mono", monospace; background: var(--ink); color: var(--ground); padding: 3px 8px; border-radius: 5px; }
  .vcap p { margin: 6px 0 0; color: var(--ink-soft); font-size: 13.5px; max-width: 74ch; }

  /* ---------------------------------------------------------------- hero shared */
  .hero { background: var(--hero); }
  .hero .shell { padding-top: clamp(28px, 5vw, 64px); padding-bottom: clamp(28px, 5vw, 60px); }
  .hero h1 { font-size: clamp(30px, 4.6vw, 52px); line-height: 1.04; font-weight: 800; letter-spacing: -0.02em; }
  .hero .lede { margin: 14px 0 0; font-size: clamp(15px, 1.6vw, 17.5px); color: var(--ink-soft); max-width: 52ch; }

  /* ---------------------------------------------------------------- funnel: shared innards */
  .funnel-eyebrow { font: 600 11px/1 "Spline Sans Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  .slot-btn {
    display: flex; flex-direction: column; gap: 3px; text-align: left;
    background: var(--panel); border: 1px solid var(--hair-strong); padding: 12px 15px;
    min-width: 0;
  }
  .slot-btn:hover:not(:disabled) { border-color: var(--brand); }
  .slot-btn:disabled { opacity: .5; cursor: not-allowed; }
  .slot-btn[data-on="1"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .slot-btn .s-lbl { font: 600 10.5px/1 "Spline Sans Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .slot-btn .s-lbl .n { width: 17px; height: 17px; border-radius: 999px; display: grid; place-items: center; background: var(--panel-2); color: var(--ink-soft); font-size: 10px; border: 1px solid var(--hair-strong); }
  .slot-btn.filled .s-lbl .n { background: var(--brand); color: #fff; border-color: var(--brand); }
  .slot-btn .s-val { font-family: "Archivo", sans-serif; font-weight: 600; font-size: 15px; color: var(--ink); }
  .slot-btn .s-val.ph { color: var(--muted); font-weight: 500; }

  .search-btn {
    background: var(--gold); color: var(--gold-ink); border: 1px solid var(--gold-deep);
    font-family: "Archivo", sans-serif; font-weight: 700; font-size: 15.5px;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    padding: 12px 26px;
  }
  .search-btn:hover:not(:disabled) { filter: brightness(1.04); }
  .search-btn:disabled { opacity: .5; cursor: not-allowed; }
  .search-btn svg { width: 17px; height: 17px; }

  .panelpop {
    background: var(--panel); border: 1px solid var(--hair-strong); box-shadow: var(--shadow-md);
    padding: 18px; margin-top: 10px;
  }
  .panelpop > h4 { font-size: 13px; font-family: "Spline Sans Mono", monospace; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .pp-hint { color: var(--ink-soft); font-size: 13.5px; padding: 6px 2px; }

  .opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .opt {
    text-align: left; background: var(--panel); border: 1px solid var(--hair-strong);
    padding: 11px 13px; display: flex; flex-direction: column; gap: 2px;
  }
  .opt:hover { border-color: var(--brand); background: var(--panel-2); }
  .opt.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .opt .o-t { font-family: "Archivo", sans-serif; font-weight: 600; font-size: 15px; }
  .opt .o-s { font-size: 12px; color: var(--muted); }

  .spec-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .spec-card {
    text-align: left; background: var(--panel); border: 1px solid var(--hair-strong);
    padding: 13px 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .spec-card:hover { border-color: var(--brand); background: var(--panel-2); }
  .spec-card.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .sc-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .sc-name { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 17px; }
  .sc-yrs { font: 500 12px/1 "Spline Sans Mono", monospace; color: var(--ink-soft); }
  .sc-specs { display: flex; flex-wrap: wrap; gap: 5px; }
  .sc-chip { font-size: 11.5px; background: var(--panel-2); border: 1px solid var(--hair); border-radius: 4px; padding: 2px 7px; color: var(--ink-soft); }
  .sc-chip.mono { font-family: "Spline Sans Mono", monospace; }
  .sc-gen { font-size: 12px; color: var(--muted); }
  .notsure-btn {
    margin-top: 12px; width: 100%; text-align: left;
    background: var(--panel-2); border: 1px dashed var(--hair-strong);
    padding: 12px 14px; font-weight: 500; color: var(--ink-soft); font-size: 13.5px;
  }
  .notsure-btn:hover { border-color: var(--brand); color: var(--ink); }
  .notsure-btn[data-on="1"] { border-style: solid; border-color: var(--brand); color: var(--ink); box-shadow: inset 0 0 0 1px var(--brand); background: var(--panel); }

  .part-groups { display: grid; gap: 14px; }
  .pg h5 { font: 500 11px/1 "Spline Sans Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .pg-opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .pg-opt { background: var(--panel); border: 1px solid var(--hair-strong); padding: 6px 12px; font-size: 13px; }
  .pg-opt:hover { border-color: var(--brand); }
  .pg-opt.on { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* ---------------------------------------------------------------- badges + listing cards */
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.fit { background: var(--confirmed-soft); color: var(--confirmed); }
  .badge.prov { background: var(--unverified-soft); color: var(--unverified); }
  .fit-note { font-size: 12px; color: var(--unverified); font-style: italic; }

  .lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 16px; }
  .lscroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
  .lscroll .lcard { scroll-snap-align: start; }
  .lcard { background: var(--panel); border: 1px solid var(--hair); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; min-width: 0; }
  .lc-img { aspect-ratio: 4 / 3; background: hsl(var(--h, 280) 22% 84%); display: grid; place-items: end start; padding: 8px; }
  :root:not([data-theme="light"]) .lc-img { background: hsl(var(--h, 280) 20% 26%); }
  :root[data-theme="dark"] .lc-img { background: hsl(var(--h, 280) 20% 26%); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lc-img { background: hsl(var(--h, 280) 20% 26%); } }
  .lc-img span { font: 500 10.5px/1 "Spline Sans Mono", monospace; background: rgba(0,0,0,.55); color: #fff; padding: 3px 6px; border-radius: 4px; }
  .lc-body { padding: 12px 13px 14px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .lc-price { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 21px; font-variant-numeric: tabular-nums; }
  .lc-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .lc-prov { font-size: 12px; color: var(--brand); font-weight: 500; }
  :root[data-theme="dark"] .lc-prov, :root:not([data-theme="light"]) .lc-prov { color: #c874c2; }
  .lc-pn { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
  .lc-body .badge { align-self: flex-start; margin-top: 3px; }

  /* ---------------------------------------------------------------- section furniture */
  section.block { padding: clamp(30px, 5vw, 56px) 0; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .sec-head h3 { font-size: clamp(20px, 2.4vw, 27px); }
  .sec-head .aside { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .tag-v2 { font: 600 10.5px/1 "Spline Sans Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--unverified); background: var(--unverified-soft); border-radius: 999px; padding: 4px 9px; }
  .is-v2 { opacity: .62; }
  .carou-btns { display: flex; gap: 6px; }
  .carou-btns button { width: 34px; height: 34px; border: 1px solid var(--hair-strong); background: var(--panel); display: grid; place-items: center; }
  .carou-btns button:hover { border-color: var(--brand); }

  .steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .step3 { display: flex; flex-direction: column; gap: 6px; padding: 20px; background: var(--panel); border: 1px solid var(--hair); }
  .step3 .num { font: 700 12px/1 "Spline Sans Mono", monospace; color: var(--brand); }
  .step3 h4 { font-size: 16px; }
  .step3 p { margin: 0; font-size: 13px; color: var(--ink-soft); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .tile { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 17px; background: var(--panel); border: 1px solid var(--hair); }
  .tile:hover { border-color: var(--brand); }
  .tile .t-name { font-family: "Archivo", sans-serif; font-weight: 600; font-size: 15px; }
  .tile .t-count { font: 500 13px/1 "Spline Sans Mono", monospace; color: var(--muted); font-variant-numeric: tabular-nums; }

  .donors { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .donor { padding: 15px 16px; background: var(--panel); border: 1px solid var(--hair); display: flex; flex-direction: column; gap: 4px; }
  .donor:hover { border-color: var(--brand); }
  .donor .d-car { font-family: "Archivo", sans-serif; font-weight: 600; font-size: 15px; }
  .donor .d-sub { font-size: 12px; color: var(--muted); }
  .donor .d-count { font: 500 12.5px/1 "Spline Sans Mono", monospace; color: var(--brand); margin-top: 3px; }

  .trust { background: var(--panel); border: 1px solid var(--hair); padding: 22px; display: flex; flex-direction: column; gap: 16px; }
  .trust h3 { font-size: 18px; }
  .trust ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .trust li { display: flex; gap: 11px; font-size: 13.5px; color: var(--ink-soft); }
  .trust li svg { width: 19px; height: 19px; flex: none; color: var(--confirmed); margin-top: 1px; }
  .trust .feat { border-top: 1px solid var(--hair); padding-top: 16px; }
  .trust .feat .funnel-eyebrow { display: block; margin-bottom: 8px; }

  .searched-note { margin-top: 12px; font-size: 12.5px; color: var(--ink-soft); background: var(--panel-2); border: 1px dashed var(--hair-strong); padding: 10px 13px; }
  .searched-note b { color: var(--ink); }

  /* live counter pill */
  .stockpill { display: inline-flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--hair-strong); padding: 6px 13px; font-size: 13px; }
  .stockpill b { font-family: "Archivo", sans-serif; font-weight: 700; }
  .stockpill .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--confirmed); }

  footer.foot { background: var(--brand); color: var(--brand-ink); margin-top: 40px; }
  footer.foot .shell { padding-top: 26px; padding-bottom: 26px; display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: center; }
  footer.foot .brand { font-size: 20px; }
  footer.foot nav { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; }
  footer.foot nav a { color: var(--brand-ink); text-decoration: none; opacity: .9; }
  footer.foot nav a:hover { opacity: 1; text-decoration: underline; }
  footer.foot .disc { margin-left: auto; font: 500 11.5px/1.5 "Spline Sans Mono", monospace; opacity: .85; }

  /* ---------------------------------------------------------------- VARIANT A: horizontal bar */
  .a-hero-grid { display: grid; gap: 26px; }
  .a-bar-wrap { }
  .a-bar-wrap .funnel-eyebrow { display: block; margin-bottom: 10px; }
  .a-bar {
    display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 1px;
    background: var(--hair-strong); border: 1px solid var(--hair-strong); box-shadow: var(--shadow-md);
  }
  .a-bar .slot-btn { border: none; }
  .a-bar .search-btn { border: none; border-radius: 0; }
  @media (max-width: 760px) { .a-bar { grid-template-columns: 1fr 1fr; } .a-bar .search-btn { grid-column: 1 / -1; } }

  /* ---------------------------------------------------------------- VARIANT B: funnel is the hero */
  .b-panel { background: var(--panel); border: 1px solid var(--hair-strong); box-shadow: var(--shadow-md); padding: clamp(18px, 3vw, 30px); }
  .b-panel > .funnel-eyebrow { display: block; margin-bottom: 6px; }
  .b-panel h1 { font-size: clamp(24px, 3.4vw, 38px); margin-bottom: 20px; }
  .b-seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .b-seg button {
    display: flex; align-items: center; gap: 8px; background: var(--panel-2);
    border: 1px solid var(--hair-strong); padding: 9px 14px; font-weight: 600; font-size: 13.5px; color: var(--ink-soft);
  }
  .b-seg button .n { width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--hair-strong); font: 500 10px/1 "Spline Sans Mono", monospace; }
  .b-seg button.filled { color: var(--ink); border-color: var(--brand); }
  .b-seg button.filled .n { background: var(--brand); color: #fff; border-color: var(--brand); }
  .b-seg button.current { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .b-seg button.current .n { background: var(--ground); color: var(--ink); border-color: var(--ground); }
  .b-seg button:disabled { opacity: .45; cursor: not-allowed; }
  .b-stage { border-top: 1px solid var(--hair); margin-top: 16px; padding-top: 18px; }
  .b-stage > h4 { font-size: 17px; margin-bottom: 14px; }
  .b-foot { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 18px; }
  .b-foot .search-btn { margin-left: auto; }
  @media (max-width: 620px) { .b-foot .search-btn { margin-left: 0; width: 100%; } }

  /* ---------------------------------------------------------------- VARIANT C: split hero */
  .c-hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 26px; align-items: start; }
  @media (max-width: 900px) { .c-hero-grid { grid-template-columns: 1fr; } }
  .c-hero-grid h1 { font-size: clamp(26px, 3vw, 38px); }
  .c-hero-grid .lede { margin-top: 10px; }
  .c-card { background: var(--panel); border: 1px solid var(--hair-strong); box-shadow: var(--shadow-md); padding: 20px; margin-top: 16px; }
  /* Search sits in the card header so it is in the first frame, before any scroll */

const LISTINGS = [

/* =============================================================== helpers */
const byId = {};
CATALOG.makes.forEach(mk => { byId[mk.id]=mk; mk.models.forEach(md => { byId[md.id]=md; md.makeId=mk.id; md.mods.forEach(mo => { byId[mo.id]=mo; mo.modelId=md.id; }); }); });
CATALOG.groups.forEach(g => { byId[g.id]=g; g.cats.forEach(c => { byId[c.id]=c; c.groupId=g.id; }); });

const CONDLABEL = { new:'New', used_good:'Used – good', needs_repair:'Needs repair' };
const CONDRANK  = { new:0, used_good:1, needs_repair:2 };
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hueOf = s => { let h=0; for (const c of s) h=(h*31 + c.charCodeAt(0)) % 360; return h; };

const modsOfModel = id => byId[id].mods.map(m => m.id);
function carOf(modId){ const mo=byId[modId], md=byId[mo.modelId], mk=byId[md.makeId]; return {mo,md,mk}; }
const carTitle      = modId => { const {md,mk}=carOf(modId); return `${mk.name} ${md.name}`; };
const maskDonorShort = modId => { const {mo,md,mk}=carOf(modId); return `${mk.name} ${md.name} ${mo.label} (${mo.code})`; };

/* union of Fitment path + Provenance path — docs/fitment-and-compatibility-search.html §3 */
function search({ modelId, modId, catId, sort='recency' }){
  if (!catId) return [];
  const scope = modId ? [modId] : (modelId ? modsOfModel(modelId) : []);
  const rows = LISTINGS.filter(l => l.cat === catId).map(l => {
    const fitMatch  = l.fitment.some(f => scope.includes(f));
    const provMatch = scope.includes(l.donor);
    if (!fitMatch && !provMatch) return null;
    return { ...l, bucket: fitMatch ? 'fit' : 'prov', note: fitMatch ? l.fitNote : null };
  }).filter(Boolean);
  const within = (a,b) =>
    sort==='price'     ? a.priceEur - b.priceEur :
    sort==='condition' ? (CONDRANK[a.condition]-CONDRANK[b.condition]) || (a.days-b.days) :
                         a.days - b.days;
  rows.sort((a,b) => (a.bucket===b.bucket ? 0 : a.bucket==='fit' ? -1 : 1) || within(a,b));
  return rows;
}
function inStock(modelId, modId, catId){
  const scope = modId ? [modId] : (modelId ? modsOfModel(modelId) : []);
  if (!scope.length) return 0;
  return LISTINGS.filter(l => (!catId || l.cat === catId) &&
    (l.fitment.some(f => scope.includes(f)) || scope.includes(l.donor))).length;
}
// "whole-model:" notes are staff traceability, not a buyer caveat (see #7 open question)
const buyerNote = r => (r.note && !/^whole-model:/.test(r.note)) ? r.note : null;
function badgeHTML(r){
  const n = buyerNote(r);
  return r.bucket === 'fit'
    ? `<span class="badge fit">&#10003; Confirmed fit</span>${n ? ` <span class="fit-note">${esc(n)}</span>` : ''}`
    : `<span class="badge prov">From a matching car</span>`;
}
function listingCard(r){
  return `<article class="lcard">
    <div class="lc-img" style="--h:${hueOf(r.code)}"><span>${r.photos} photos</span></div>
    <div class="lc-body">
      <div class="lc-price">&euro;${r.priceEur.toFixed(2)}</div>
      <h4 class="lc-title">${esc(carTitle(r.donor))} &mdash; ${esc(byId[r.cat].name)}</h4>
      <div class="lc-prov">Taken from: ${esc(maskDonorShort(r.donor))}</div>
      <div class="lc-pn mono">${esc(r.pn)}</div>
      ${badgeHTML(r)}
    </div>
  </article>`;
}
const MOST_VIEWED = ['LST-004500','LST-004203','LST-004512','LST-003655','LST-004010','LST-003820','LST-004321']
  .map(c => LISTINGS.find(l => l.code === c));

/* =============================================================== shared funnel option markup */
function stepOptions(step, s){
  if (step === 'make')
    return `<div class="opt-grid">${CATALOG.makes.map(mk =>
      `<button class="opt${s.makeId===mk.id?' on':''}" data-pick="make" data-val="${mk.id}">
        <span class="o-t">${mk.name}</span><span class="o-s">${mk.models.length} model${mk.models.length>1?'s':''}</span>
      </button>`).join('')}</div>`;

  if (step === 'model'){
    if (!s.makeId) return `<p class="pp-hint">Choose a make first.</p>`;
    return `<div class="opt-grid">${byId[s.makeId].models.map(md =>
      `<button class="opt${s.modelId===md.id?' on':''}" data-pick="model" data-val="${md.id}">
        <span class="o-t">${md.name}</span><span class="o-s">${md.mods.length} engine variant${md.mods.length>1?'s':''}</span>
      </button>`).join('')}</div>`;
  }

  if (step === 'engine'){
    if (!s.modelId) return `<p class="pp-hint">Choose a model first.</p>`;
    const md = byId[s.modelId];
    return `<div class="spec-cards">${md.mods.map(mo =>
      `<button class="spec-card${s.modId===mo.id?' on':''}" data-pick="engine" data-val="${mo.id}">
        <span class="sc-top"><span class="sc-name">${mo.label}</span><span class="sc-yrs">${mo.years}</span></span>
        <span class="sc-specs">
          <span class="sc-chip">${mo.fuel}</span><span class="sc-chip">${mo.hp} hp</span>
          <span class="sc-chip">${mo.body}</span><span class="sc-chip mono">${mo.code}</span>
        </span>
        <span class="sc-gen">${mo.gen}</span>
      </button>`).join('')}</div>
      <button class="notsure-btn" data-notsure="1"${s.modId===null && s.engineTouched ? ' data-on="1"' : ''}>
        I&rsquo;m not sure which engine &mdash; search all ${esc(md.name)} variants, with a &#10003; badge on the parts our team checked against yours
      </button>`;
  }

  if (step === 'part')
    return `<div class="part-groups">${CATALOG.groups.map(g =>
      `<div class="pg"><h5>${g.name}</h5><div class="pg-opts">${g.cats.map(c =>
        `<button class="pg-opt${s.catId===c.id?' on':''}" data-pick="part" data-val="${c.id}">${c.name}</button>`).join('')}
      </div></div>`).join('')}</div>`;
  return '';
}

const STEP_TITLE = { make:'Which make?', model:'Which model?', engine:'Which engine variant?', part:'What part do you need?' };
const stepFilled = (step, s) =>
  step==='make'   ? !!s.makeId :
  step==='model'  ? !!s.modelId :
  step==='engine' ? (!!s.modId || s.engineTouched) :
                    !!s.catId;
const stepEnabled = (step, s) =>
  step==='make'  ? true :
  step==='model' ? !!s.makeId :
  step==='engine'? !!s.modelId :
                   true;
function slotValue(step, s){
  if (step==='make')  return s.makeId ? byId[s.makeId].name : null;
  if (step==='model') return s.modelId ? byId[s.modelId].name : null;
  if (step==='engine') return s.modId ? byId[s.modId].label : (s.engineTouched ? 'All variants' : null);
  return s.catId ? byId[s.catId].name : null;
}
const canSearch = s => !!s.makeId && !!s.modelId;

/* wires [data-pick] / [data-notsure] / [data-slot] / [data-search] inside `root` */
function wireFunnel(root, s, rerender){
  root.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const v = b.dataset.val;
    if (b.dataset.pick === 'make')  { s.makeId=v; s.modelId=null; s.modId=null; s.engineTouched=false; s.openSlot='model'; }
    if (b.dataset.pick === 'model') { s.modelId=v; s.modId=null; s.engineTouched=false; s.openSlot='engine'; }
    if (b.dataset.pick === 'engine'){ s.modId=v; s.engineTouched=true; s.openSlot='part'; }
    if (b.dataset.pick === 'part')  { s.catId=v; s.openSlot = canSearch(s) ? null : 'make'; }
    rerender();
  });
  root.querySelectorAll('[data-notsure]').forEach(b => b.onclick = () => {
    s.modId=null; s.engineTouched=true; s.openSlot='part'; rerender();
  });
  root.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => {
    const k = b.dataset.slot;
    if (!stepEnabled(k, s)) return;
    s.openSlot = s.openSlot === k ? null : k;
    rerender();
  });
  const sb = root.querySelector('[data-search]');
  if (sb) sb.onclick = () => {
    if (canSearch(s)) { s.searched = true; s.openSlot = null; }
    else { s.openSlot = !s.makeId ? 'make' : 'model'; }   // never a dead button — guide to the next gap
    rerender();
  };
}

function resultsPreview(s){
  if (!s.searched) return '';
  const rows = s.catId ? search({ modelId:s.modelId, modId:s.modId, catId:s.catId }) : [];
  const car = `${carTitle(s.modId || modsOfModel(s.modelId)[0])}${s.modId ? ' '+byId[s.modId].label : ' · all variants'}`;
  const partTxt = s.catId ? byId[s.catId].name : 'parts';
  if (!s.catId){
    const n = inStock(s.modelId, s.modId, null);
    return `<div class="searched-note">Partial funnel &mdash; no part chosen. Browse would open on <b>${esc(car)}</b> showing <b>${n}</b> listing${n===1?'':'s'} across all part types, with the part filter still to pick. <em>(Browse screen prototyped separately.)</em></div>`;
  }
  return `<div style="margin-top:18px">
    <div class="sec-head" style="margin-bottom:12px">
      <h3 style="font-size:18px">${rows.length} ${esc(partTxt.toLowerCase())}${rows.length===1?'':'s'} for ${esc(car)}</h3>
      <span class="aside">${rows.filter(r=>r.bucket==='fit').length} confirmed fit &middot; ${rows.filter(r=>r.bucket==='prov').length} from a matching car</span>
    </div>
    ${rows.length
      ? `<div class="lgrid">${rows.slice(0,4).map(listingCard).join('')}</div>
         <div class="searched-note">This is where the <b>Browse</b> results screen opens &mdash; ranking, sort-within-bucket and empty states are being prototyped there, not here.</div>`
      : `<div class="searched-note">No ${esc(partTxt.toLowerCase())} in the catalogue fits this car yet. Browse would offer <b>&ldquo;notify me when one is listed&rdquo;</b> plus a one-tap widen to all ${esc(byId[s.modelId].name)} variants.</div>`}
  </div>`;
}

/* =============================================================== shared page sections */
function howItWorks(){
  return `<section class="block"><div class="shell">
    <div class="sec-head"><h3>How IVO works</h3></div>
    <div class="steps3">
      <div class="step3"><span class="num">01</span><h4>Tell us your car</h4><p>Make, model, and engine variant &mdash; no VIN needed. Not sure which engine? Say so and we search every variant of your model.</p></div>
      <div class="step3"><span class="num">02</span><h4>We show what fits</h4><p>Parts our team confirmed against your exact engine carry a &#10003; badge. Parts pulled from a matching car sit just below, worth a closer look.</p></div>
      <div class="step3"><span class="num">03</span><h4>Order &mdash; we handle the rest</h4><p>Staff-checked packing and delivery across Bulgaria. Prices in EUR. One part per order in this release.</p></div>
    </div>
  </div></section>`;
}
function mostViewed(scroller){
  return `<section class="block is-v2"><div class="shell">
    <div class="sec-head">
      <h3>Most viewed</h3>
      <span class="aside"><span class="tag-v2">v2 &mdash; not first release</span>
        ${scroller ? '<span class="carou-btns"><button data-carou="-1" aria-label="Back">&lsaquo;</button><button data-carou="1" aria-label="Forward">&rsaquo;</button></span>' : ''}</span>
    </div>
    <div class="${scroller ? 'lscroll' : 'lgrid'}" id="mv-track">${MOST_VIEWED.map(listingCard).join('')}</div>
  </div></section>`;
}
function wireCarousel(root){
  const track = root.querySelector('#mv-track');
  root.querySelectorAll('[data-carou]').forEach(b => b.onclick = () => {
    if (track) track.scrollBy({ left: (+b.dataset.carou) * Math.min(track.clientWidth * 0.8, 600), behavior: 'smooth' });
  });
}

/* =============================================================== VARIANT A — horizontal bar */
function VariantA(root){
  const s = { makeId:null, modelId:null, modId:null, engineTouched:false, catId:null, openSlot:null, searched:false };
  const STEPS = ['make','model','engine','part'];

  function slot(step, i){
    const filled = stepFilled(step, s), enabled = stepEnabled(step, s), val = slotValue(step, s);
    return `<button class="slot-btn${filled?' filled':''}" data-slot="${step}" ${enabled?'':'disabled'} ${s.openSlot===step?'data-on="1"':''}>
      <span class="s-lbl"><span class="n">${i+1}</span>${step==='engine'?'Engine variant':step}</span>
      <span class="s-val${val?'':' ph'}">${val ? esc(val) : (step==='engine' ? 'Optional' : 'Choose')}</span>
    </button>`;
  }
  function render(){
    root.innerHTML = `
      <div class="vcap"><div class="shell">
        <div class="row"><h2>Their mock, realized</h2><span class="k">variant A</span></div>
        <p>Faithful to <span class="mono">UI/Homepage</span>: purple chrome, the headline, a horizontal 4-slot bar. Tapping a slot drops a panel below it. Engine variant is spec cards; discovery below is the Most&nbsp;Viewed carousel.</p>
      </div></div>
      <section class="hero"><div class="shell">
        <div class="a-hero-grid">
          <div>
            <h1>Find the part you need,<br>without the wait.</h1>
            <p class="lede">Used OEM parts from Bulgarian dismantlers &mdash; every fitment checked by our team before it goes live.</p>
          </div>
          <div class="a-bar-wrap">
            <span class="funnel-eyebrow">Parts you need</span>
            <div class="a-bar">
              ${STEPS.map(slot).join('')}
              <button class="search-btn" data-search="1" ${canSearch(s)?'':'disabled'}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                Search
              </button>
            </div>
            ${s.openSlot ? `<div class="panelpop"><h4>${STEP_TITLE[s.openSlot]}</h4>${stepOptions(s.openSlot, s)}</div>` : ''}
            ${!s.openSlot && !canSearch(s) ? `<p class="pp-hint" style="padding-top:10px">Pick at least a make and model. Engine variant is optional &mdash; skip it and we widen the search.</p>` : ''}
            ${resultsPreview(s)}
          </div>
        </div>
      </div></section>
      ${mostViewed(true)}
      ${howItWorks()}`;
    wireFunnel(root, s, render);
    wireCarousel(root);
  }
  render();
}

/* =============================================================== VARIANT B — funnel is the hero */
function VariantB(root){
  const s = { makeId:null, modelId:null, modId:null, engineTouched:false, catId:null, openSlot:'make', searched:false };
  const STEPS = ['make','model','engine','part'];

  function seg(step, i){
    const filled = stepFilled(step, s), cur = s.openSlot===step, enabled = stepEnabled(step, s);
    const val = slotValue(step, s);
    return `<button data-slot="${step}" class="${filled?'filled ':''}${cur?'current':''}" ${enabled?'':'disabled'}>
      <span class="n">${i+1}</span>${step==='engine'?'Engine':step[0].toUpperCase()+step.slice(1)}${val?` &middot; ${esc(val)}`:''}
    </button>`;
  }
  function render(){
    const active = s.openSlot || 'make';
    const stock = s.modelId ? inStock(s.modelId, s.modId, s.catId) : null;
    root.innerHTML = `
      <div class="vcap"><div class="shell">
        <div class="row"><h2>The funnel is the hero</h2><span class="k">variant B</span></div>
        <p>No marketing headline competing for the fold &mdash; the funnel panel <em>is</em> the hero. Steps are a segmented control; the active step&rsquo;s options open inside the same panel (the accumulating-page shell). A live &ldquo;in stock for this car&rdquo; count gives feedback as you go. Discovery below is browse-by-dismantled-car.</p>
      </div></div>
      <section class="hero"><div class="shell">
        <div class="b-panel">
          <span class="funnel-eyebrow">Find a part for your car</span>
          <h1>What are you looking for?</h1>
          <div class="b-seg">${STEPS.map(seg).join('')}</div>
          <div class="b-stage">
            <h4>${STEP_TITLE[active]}${active==='engine'?' <span class="funnel-eyebrow">optional</span>':''}</h4>
            ${stepOptions(active, s)}
          </div>
          <div class="b-foot">
            ${stock !== null ? `<span class="stockpill"><span class="dot"></span> <b>${stock}</b> ${s.catId?esc(byId[s.catId].name.toLowerCase()):'part'}${stock===1?'':'s'} in stock for ${esc(carTitle(s.modId||modsOfModel(s.modelId)[0]))}${s.modId?' '+esc(byId[s.modId].label):''}</span>` : `<span class="stockpill">Set your car to see stock</span>`}
            <button class="search-btn" data-search="1" ${canSearch(s)?'':'disabled'}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              ${s.catId ? 'See '+ (stock||0) +' listing'+((stock||0)===1?'':'s') : 'Search all part types'}
            </button>
          </div>
          ${resultsPreview(s)}
        </div>
      </div></section>
      ${browseByCar()}
      ${mostViewed(false)}`;
    wireFunnel(root, s, render);
    root.querySelectorAll('[data-donor]').forEach(b => b.onclick = () => {
      const mo = byId[b.dataset.donor];
      s.makeId = byId[mo.modelId].makeId; s.modelId = mo.modelId; s.modId = mo.id; s.engineTouched = true; s.openSlot = 'part';
      window.scrollTo({ top: 0, behavior: 'smooth' }); render();
    });
    wireCarousel(root);
  }
  function browseByCar(){
    const donorIds = [...new Set(LISTINGS.map(l => l.donor))];
    return `<section class="block"><div class="shell">
      <div class="sec-head"><h3>Browse by dismantled car</h3><span class="aside">every part traces back to one of these</span></div>
      <div class="donors">${donorIds.map(id => {
        const { mo } = carOf(id); const n = LISTINGS.filter(l => l.donor === id).length;
        return `<button class="donor" data-donor="${id}">
          <span class="d-car">${esc(carTitle(id))} ${esc(mo.label)}</span>
          <span class="d-sub">${esc(mo.fuel)} &middot; ${esc(mo.hp)} hp &middot; ${esc(mo.years)} &middot; <span class="mono">${esc(mo.code)}</span></span>
          <span class="d-count">${n} part${n===1?'':'s'} listed &rsaquo;</span>
        </button>`;
      }).join('')}</div>
    </div></section>`;
  }
  render();
}

        <span class="s-val${val?'':' ph'}">${val ? esc(val) : 'Choose'}</span>
      </button>
      ${s.openSlot===step ? `<div class="panelpop c-panel-inline"><h4>${STEP_TITLE[step]}</h4>${stepOptions(step, s)}</div>` : ''}

  function render(){
    root.innerHTML = `

        <div class="row"><h2>Split hero &mdash; funnel beside the promise</h2><span class="k">variant C</span></div>
        <p>Two columns: a compact vertical funnel on the left, the trust story on the right (staff-verified fitment, a featured listing). <b>Search sits in the funnel card&rsquo;s header</b> &mdash; visible the moment you land, before any scroll &mdash; and always leads somewhere: it opens the next empty step until make + model are set, then goes to Browse. Category tiles with live in-stock counts do the discovery job instead of a carousel.</p>

      <section class="hero"><div class="shell">
        <div class="c-hero-grid">
          <div>
            <h1>Find the part you need, without the wait.</h1>
            <p class="lede">Used OEM parts from Bulgarian dismantlers, fitment checked by our team.</p>
            <div class="c-card">
              <div class="c-card-head">
                <span class="funnel-eyebrow">Your car &amp; part</span>
                <button class="search-btn" data-search="1">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

                </button>

                  ? `<span class="stockpill"><span class="dot"></span> <b>${inStock(s.modelId, s.modId, s.catId)}</b> ${s.catId?esc(byId[s.catId].name.toLowerCase()):'part'}${inStock(s.modelId, s.modId, s.catId)===1?'':'s'} in stock &mdash; tap Search to open Browse</span>`
                  : `<span class="hint">Pick your make and model &mdash; engine variant is optional. Search opens the Browse results page.</span>`}
              </div>
              ${resultsPreview(s)}
            </div>
          </div>
          <aside class="trust">
            <h3>Why buyers trust IVO</h3>
            <ul>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 13 4 4L19 7"/></svg> Every part traces back to a real dismantled car &mdash; you see which one.</li>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 13 4 4L19 7"/></svg> Fitment is verified by our team against your engine, not guessed from a database.</li>
              <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 13 4 4L19 7"/></svg> Staff-checked packing, delivery across Bulgaria, prices in EUR.</li>
            </ul>
            <div class="feat">
              <span class="funnel-eyebrow">Just in</span>
              ${listingCard(LISTINGS.find(l => l.code === 'LST-004500'))}
            </div>
          </aside>
        </div>
      </div></section>
      ${categoryTiles()}
      ${mostViewed(true)}`;
    wireFunnel(root, s, render);
    root.querySelectorAll('[data-tilecat]').forEach(b => b.onclick = () => {
      s.catId = b.dataset.tilecat; s.openSlot = canSearch(s) ? null : 'make';
      window.scrollTo({ top: 0, behavior: 'smooth' }); render();
    });
    wireCarousel(root);
  }
  function categoryTiles(){
    return `<section class="block"><div class="shell">
      <div class="sec-head"><h3>What&rsquo;s in stock right now</h3><span class="aside">across every car in the catalogue</span></div>
      <div class="tiles">${CATALOG.groups.flatMap(g => g.cats).map(c => {
        const n = LISTINGS.filter(l => l.cat === c.id).length;
        return `<button class="tile" data-tilecat="${c.id}" ${n?'':'disabled'} style="${n?'':'opacity:.45'}">
          <span class="t-name">${esc(c.name)}</span><span class="t-count">${n}</span>
        </button>`;
      }).join('')}</div>
    </div></section>`;
  }
  render();
}

/* =============================================================== switcher */
const VARIANTS = [
  { key:'A', name:'Their mock, realized', fn:VariantA },
  { key:'B', name:'Funnel is the hero',   fn:VariantB },
  { key:'C', name:'Split hero + trust',   fn:VariantC },
];
const stage = document.getElementById('stage');
const swLabel = document.getElementById('swLabel');
const currentIdx = () => {
  const p = (new URLSearchParams(location.search)).get('variant');
  const i = VARIANTS.findIndex(v => v.key === (p||'').toUpperCase());
  return i < 0 ? 0 : i;
};
function show(i){
  const v = VARIANTS[(i + VARIANTS.length) % VARIANTS.length];
  const url = new URL(location.href); url.searchParams.set('variant', v.key); history.replaceState(null, '', url);
  swLabel.innerHTML = `<span class="k">${v.key}</span><b>${v.name}</b>`;
  stage.innerHTML = ''; v.fn(stage); window.scrollTo(0, 0);
}
document.getElementById('prev').onclick = () => show(currentIdx() - 1);
document.getElementById('next').onclick = () => show(currentIdx() + 1);
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft')  show(currentIdx() - 1);
  if (e.key === 'ArrowRight') show(currentIdx() + 1);
});
show(currentIdx());
</script>
